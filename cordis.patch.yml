# This bundle's patch: make this engine the compaction backend the host plane
# falls back to, and nothing else.
#
# What this file must NOT do, and used to: register a preset by patching the
# agent-preset roster's config. On the running host line (DSH 0.2.0-rc.2) that
# roster's row id is `agent-preset-registry` and its Config schema is only
# `{ default, selectedDefault }`; the `roots` / `includeShippedRoot` /
# `includeUserRoot` fields this patch used to write do not exist there. An
# unmatched patch id is not an error: `applyEntryPatches` only WARNS
# ("patch: entry %C not found") and skips the patch, so the bundle installed,
# the host booted clean, and the patch did nothing at all.
#
# The shipped `standard-rollover` preset is therefore declared the way the host
# declares its own shipped presets, as a second entry in this package's
# `dsh.bundle.patch` array (`./presets/standard-rollover/declaration.patch.yml`,
# generated by `scripts/make-web-preset.mjs`). Nothing here touches preset
# roster fields, and the deployment keeps owning `default` / `selectedDefault`.
#
# `- id: compaction-basic  disabled: true` follows the web-app bundle's own
# precedent for the same row. It covers rosterless deployments (headless,
# base-only profiles) where no preset mounts a backend, so this engine's
# inserted host row below is the only one. Web sessions still resolve their
# preset's own engine, and this engine defers to a preset-owned backend.
#
# Loudness: no patch mechanism can fail a boot. `applyEntryPatches` warns and
# skips, and a throwing `!!js` expression inside a config value is only logged
# (verified against this host build). The `requiredStartupEntryIds` list that
# can reject startup is fixed in `dsh-app-boot` and cannot be extended from a
# bundle. So this file's targets are asserted by a test instead: see
# `tests/web-preset.spec.ts`, which composes the real host bundle tree with
# this file and fails on any skipped patch or missing target row.
- id: compaction-basic
  disabled: true

# The row below also arms the idle rollover watchdog: a session idle for 40
# minutes and above 90,000 tokens gets one `/rollover` message, and preset rows
# stay off because a preset mounts one shared engine for every session, so a
# timer there would watch the whole registry rather than one session.
- insert:
    - id: context-rollover
      name: dsh-context-rollover
      config:
        idleRollover: true
        idleRolloverAfterMs: 2400000
        idleRolloverTokens: 90000
        idleRolloverMessage: /rollover
        idleRolloverTickMs: 60000
